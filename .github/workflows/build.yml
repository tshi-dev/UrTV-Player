# Public-repository rules for this file: no pull_request_target; pull requests from forks get NO secrets (the private-font and signing
# secrets are empty there); the release job runs only for the owner's tags or a manual run, in this repository; every action is pinned
# to a commit SHA (Dependabot keeps them current); user-controlled text (tag, branch, titles) only reaches shell steps through env vars.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Cut a signed release with this tag, e.g. v0.9.0 (empty = just build and test)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # optional secret: a token that can read tshi-dev/urtv-fonts (empty on forks and PRs, then Plex is used)
      FONTS_TOKEN: ${{ secrets.FONTS_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Thmanyah's licence allows its files only inside a built product: they live in the private tshi-dev/urtv-fonts
      # and are put in place here, never committed to this repository. Without the secret the open IBM Plex Sans Arabic is used.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ env.FONTS_TOKEN != '' }}
        with:
          repository: tshi-dev/urtv-fonts
          token: ${{ secrets.FONTS_TOKEN }}
          path: .fonts-private
      - name: Private fonts
        if: ${{ env.FONTS_TOKEN != '' }}
        run: |
          mkdir -p app/src/main/assets/fonts
          cp .fonts-private/android/*.otf app/src/main/assets/fonts/
          echo "Thmanyah pulled: $(ls app/src/main/assets/fonts | tr '\n' ' ')"
          rm -rf .fonts-private
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already ships the Android SDK (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.9'
      # Robolectric downloads Android jars from Maven Central, which sometimes answers 429: keep them between runs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
      - name: Unit tests (parsers and logic)
        run: |
          set -o pipefail
          gradle :core:test :app:testDebugUnitTest --no-daemon 2>&1 | tee test.log && exit 0
          # one retry, only when the failure was the jar download itself (never to hide a real test failure)
          grep -q MavenArtifactFetcher test.log || exit 1
          echo "::warning::Robolectric jar download failed; retrying once"
          gradle :core:test :app:testDebugUnitTest --no-daemon
      - name: Debug APK (default local debug key, no secrets)
        run: gradle :app:assembleDebug --no-daemon
      - name: "Release build (unsigned - signing happens only from CI secrets) and size budget"
        run: |
          gradle :app:assembleRelease --no-daemon
          rsize=$(stat -c %s app/build/outputs/apk/release/app-release-unsigned.apk)
          echo "Release APK size: $rsize bytes (budget 4194304)"
          test "$rsize" -le 4194304
      - name: "Debug APK size (reported, not enforced - the release APK is the shipped one)"
        run: |
          echo "Debug APK size: $(stat -c %s app/build/outputs/apk/debug/app-debug.apk) bytes"
      - name: Report APK size, dex methods and permissions
        run: |
          ls -l app/build/outputs/apk/debug/*.apk
          "$ANDROID_HOME"/cmdline-tools/latest/bin/apkanalyzer dex references app/build/outputs/apk/debug/app-debug.apk || true
          "$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)" dump permissions app/build/outputs/apk/debug/app-debug.apk || true
      # A debug APK built with the private fonts would carry them, and anyone signed in can download artifacts of a public repository:
      # upload only builds without the private fonts (forks, pull requests), and keep them briefly.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ env.FONTS_TOKEN == '' }}
        with:
          name: urtv-player-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3

  # Signed official release: runs only for tags like v0.2.0. The key lives in repository secrets, never in the code.
  release:
    if: github.repository == 'tshi-dev/UrTV-Player' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      FONTS_TOKEN: ${{ secrets.FONTS_TOKEN }}
      PLAYER_KEYSTORE_PASSWORD: ${{ secrets.PLAYER_KEYSTORE_PASSWORD }}
      PLAYER_KEY_ALIAS: ${{ secrets.PLAYER_KEY_ALIAS }}
      PLAYER_KEY_PASSWORD: ${{ secrets.PLAYER_KEY_PASSWORD }}
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Tag must look like vMAJOR.MINOR.PATCH (optionally -suffix)
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad release tag"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ env.FONTS_TOKEN != '' }}
        with:
          repository: tshi-dev/urtv-fonts
          token: ${{ secrets.FONTS_TOKEN }}
          path: .fonts-private
      - name: Private fonts
        if: ${{ env.FONTS_TOKEN != '' }}
        run: |
          mkdir -p app/src/main/assets/fonts
          cp .fonts-private/android/*.otf app/src/main/assets/fonts/
          echo "Thmanyah pulled: $(ls app/src/main/assets/fonts | tr '\n' ' ')"
          rm -rf .fonts-private
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.9'
      - name: Signing key from secrets
        env:
          KS_B64: ${{ secrets.PLAYER_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64" || { echo "::error::secret PLAYER_KEYSTORE_B64 is not set"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/player.jks"
          echo "PLAYER_KEYSTORE_FILE=$RUNNER_TEMP/player.jks" >> "$GITHUB_ENV"
          cert=$(keytool -list -v -keystore "$RUNNER_TEMP/player.jks" -alias "$PLAYER_KEY_ALIAS" -storepass "$PLAYER_KEYSTORE_PASSWORD" | grep 'SHA256:' | head -1 | awk '{print $2}')
          test -n "$cert" || { echo "::error::could not read the certificate from the keystore"; exit 1; }
          echo "PLAYER_CERT_SHA256=$cert" >> "$GITHUB_ENV"
          echo "PLAYER_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "PLAYER_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build the signed release
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify signature (v2 and v3) and size
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)" verify --verbose --print-certs "$apk" | tee verify.txt
          grep -q "v2 scheme (APK Signature Scheme v2): true" verify.txt
          grep -q "v3 scheme (APK Signature Scheme v3): true" verify.txt
          test "$(stat -c %s "$apk")" -le 4194304
          # the baseline profile must be inside the APK (fresh installs would otherwise start in the interpreter)
          unzip -l "$apk" | grep -q 'assets/dexopt/baseline.prof' || { echo '::error::baseline profile missing from the APK'; exit 1; }
      - name: Publish release assets with a sha256 file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${TAG#v}"
          # stable names (what the Player's self-update, UrTV and the direct link read) next to the versioned ones
          cp app/build/outputs/apk/release/app-release.apk urtv-player.apk
          sha256sum urtv-player.apk > urtv-player.apk.sha256
          echo "${PLAYER_VERSION_CODE} ${ver}" > urtv-player.version
          cp urtv-player.apk "urtv-player-${ver}.apk"
          sha256sum "urtv-player-${ver}.apk" > "urtv-player-${ver}.apk.sha256"
          # a tag with a suffix (v1.2.0-beta1) is a pre-release and never becomes "latest"; plain versions, 0.x included, do
          flag="--latest"; case "$ver" in *-*) flag="--prerelease";; esac
          gh release create "$TAG" urtv-player.apk urtv-player.apk.sha256 urtv-player.version "urtv-player-${ver}.apk" "urtv-player-${ver}.apk.sha256" \
            $flag --target "$GITHUB_SHA" --title "UrTV Player ${ver}" \
            --notes "Signed official build. Signing certificate SHA-256: $PLAYER_CERT_SHA256. Install it from UrTV, from inside the app (Settings > About), or verify the sha256 file."
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/player.jks"
