name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already ships the Android SDK (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests (parsers and logic)
        run: gradle :core:test :app:testDebugUnitTest --no-daemon
      - name: Debug APK (default local debug key, no secrets)
        run: gradle :app:assembleDebug --no-daemon
      - name: Release build (unsigned: signing happens only from CI secrets) and size budget
        run: |
          gradle :app:assembleRelease --no-daemon
          rsize=$(stat -c %s app/build/outputs/apk/release/app-release-unsigned.apk)
          echo "Release APK size: $rsize bytes (budget 4194304)"
          test "$rsize" -le 4194304
      - name: Enforce size budget (debug APK at most 7 MB)
        run: |
          size=$(stat -c %s app/build/outputs/apk/debug/app-debug.apk)
          echo "APK size: $size bytes (budget 7340032)"
          test "$size" -le 7340032
      - name: Report APK size, dex methods and permissions
        run: |
          ls -l app/build/outputs/apk/debug/*.apk
          "$ANDROID_HOME"/cmdline-tools/latest/bin/apkanalyzer dex references app/build/outputs/apk/debug/app-debug.apk || true
          "$ANDROID_HOME"/build-tools/*/aapt2 dump permissions app/build/outputs/apk/debug/app-debug.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: urtv-player-debug
          path: app/build/outputs/apk/debug/*.apk
