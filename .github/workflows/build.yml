name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests (parsers and logic)
        run: gradle :core:test :app:testDebugUnitTest --no-daemon
      - name: Debug APK (default local debug key, no secrets)
        run: gradle :app:assembleDebug --no-daemon
      - name: Report APK size and permissions
        run: |
          ls -l app/build/outputs/apk/debug/*.apk
          "$ANDROID_HOME"/build-tools/*/aapt2 dump permissions app/build/outputs/apk/debug/app-debug.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: urtv-player-debug
          path: app/build/outputs/apk/debug/*.apk
